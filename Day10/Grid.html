<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    .par{
        width: 100%;
        height: 700px;
        display: grid;
        justify-content: center;
        align-content: center;
        gap: 20px;
        grid-template-columns: 100px 100px 100px;
    }
    

    .box{
        width: 100px;
        height: 100px;
        background-color: antiquewhite;
        border: 2px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
    }
    .box:hover{
        background-color: black;
        color: white;
    }
</style>
<body>
    <div class="par">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">0</div>
        <div class="box">-</div>
        <div class="box">+</div>
    </div>
</body>
</html>
